---
- name: Deploy ReleaseForge web service
  hosts: all
  become: true
  gather_facts: true
  vars:
    image_name: "releaseforge:latest"
    container_name: "releaseforge-website"
    published_port: 80

  tasks:
    - name: Install Docker and Python Docker SDK on Debian-family systems
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-docker
        state: present
        update_cache: true
      when: ansible_os_family == "Debian"

    - name: Ensure Docker is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Pull deployment image from a registry when namespace is present
      community.docker.docker_image:
        name: "{{ image_name }}"
        source: pull
      when: "'/' in image_name"

    - name: Run the named website container
      community.docker.docker_container:
        name: "{{ container_name }}"
        image: "{{ image_name }}"
        state: started
        recreate: true
        restart_policy: unless-stopped
        published_ports:
          - "{{ published_port }}:80"
        labels:
          app: releaseforge
        read_only: true
        security_opts:
          - no-new-privileges:true
        cap_drop:
          - ALL
        cap_add:
          - CHOWN
          - SETGID
          - SETUID
          - NET_BIND_SERVICE
        tmpfs:
          - /var/cache/nginx
          - /var/run
          - /tmp
        healthcheck:
          test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
          interval: 30s
          timeout: 3s
          retries: 3
          start_period: 5s

    - name: Verify deployment health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ published_port }}/healthz"
        status_code: 200
        return_content: true
      register: health_result
      retries: 10
      delay: 3
      until: health_result.status == 200
