trigger:
  branches:
    include: [main, master]
pr:
  branches:
    include: [main, master]
pool:
  vmImage: ubuntu-latest
steps:
  - checkout: self
  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.12'
    displayName: Set up Python
  - script: |
      set -eu
      test -s app/index.html
      test -s app/assets/styles.css
      python -m py_compile tests/smoke_test.py
      grep -q 'ReleaseForge' app/index.html
      grep -q 'location = /healthz' docker/nginx.conf
    displayName: Validate source
  - script: docker build --pull -t releaseforge:ci .
    displayName: Build container image
  - script: |
      set -eu
      docker run -d --name releaseforge-azure-ci -p 18082:80 releaseforge:ci
      trap 'docker rm -f releaseforge-azure-ci >/dev/null 2>&1 || true' EXIT
      for attempt in $(seq 1 20); do
        if curl --fail --silent http://127.0.0.1:18082/healthz >/dev/null; then break; fi
        sleep 2
      done
      python tests/smoke_test.py http://127.0.0.1:18082
    displayName: Run container and HTTP smoke test
