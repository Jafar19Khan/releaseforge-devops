services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    image: releaseforge-demo:local
    container_name: releaseforge-website
    ports:
      - "${WEB_PORT:-8082}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/devopsIQ/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
